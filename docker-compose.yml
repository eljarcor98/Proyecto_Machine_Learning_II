services:
  svm-desercion-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: svm_desercion_streamlit
    restart: unless-stopped
    ports:
      # Puerto externo (Raspberry): Puerto interno (Contenedor)
      # Si el 8501 ya lo ocupa otro contenedor, cámbialo a 8502, 8080, etc.
      - "8502:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    # Límite de memoria para que no sature la RAM de la Raspberry Pi:
    deploy:
      resources:
        limits:
          memory: 1024M
